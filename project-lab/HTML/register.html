<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Înregistrare</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Înregistrează-te</h1>

      <form class="register-form" action="#" method="post" enctype="multipart/form-data">

        <div class="row">
          <label for="username">Nume utilizator</label>
          <input type="text" id="username" name="username" placeholder="ex: Alex" required>
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="ex: nume@exemplu.com" required>
        </div>

        <div class="row two-col">
          <div>
            <label for="password">Parolă</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div>
            <label for="confirm_password">Confirmă parola</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
          </div>
        </div>

        <div class="row">
          <label for="birthdate">Data nașterii</label>
          <input type="date" id="birthdate" name="birthdate">
        </div>

        <div class="row">
          <label>Gen</label>
          <label class="option"><input type="radio" name="gender" value="female"> Femeie</label>
          <label class="option"><input type="radio" name="gender" value="male"> Bărbat</label>
          <label class="option"><input type="radio" name="gender" value="other"> Altul</label>
        </div>

        <div class="row">
          <label for="country">Țară</label>
          <select id="country" name="country">
            <option value="">Selectează</option>
            <option value="ro">România</option>
            <option value="md">Republica Moldova</option>
            <option value="de">Germania</option>
            <option value="fr">Franța</option>
            <option value="it">Italia</option>
            <option value="uk">Regatul Unit</option>
            <option value="us">Statele Unite</option>
          </select>
        </div>

        <div class="row">
          <label for="card_type">Tip card</label>
          <select id="card_type" name="card_type">
            <option value="">Selectează</option>
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
            <option value="maestro">Maestro</option>
          </select>
        </div>

        <div class="row">
          <label>Interese</label>
          <div class="checkbox-grid">
            <label class="option"><input type="checkbox" name="interests" value="frontend"> Frontend</label>
            <label class="option"><input type="checkbox" name="interests" value="backend"> Backend</label>
            <label class="option"><input type="checkbox" name="interests" value="uxui"> UX/UI</label>
            <label class="option"><input type="checkbox" name="interests" value="javascript"> JavaScript</label>
            <label class="option"><input type="checkbox" name="interests" value="python"> Python Web</label>
            <label class="option"><input type="checkbox" name="interests" value="wordpress"> WordPress</label>
            <label class="option"><input type="checkbox" name="interests" value="django"> Django</label>
          </div>
        </div>

        <div class="row">
          <label for="avatar">Încarcă avatar</label>
          <input type="file" id="avatar" name="avatar" accept="image/*">
        </div>

        <div class="row">
          <label for="bio">Scurtă descriere</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Scrie câteva cuvinte despre tine..."></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary">Creează cont</button>
          <button type="reset" class="btn ghost">Resetează</button>
        </div>

        <p class="login-link">Ai deja cont?
          <a href="login.html">Mergi la login</a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
